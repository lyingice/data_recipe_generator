// Root build: shared conventions only. Each platform module owns its loader setup.
allprojects {
    group = 'net.lyingice.datarecipegenerator'
    version = '1.0.0'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build the Forge 1.20.1, NeoForge 1.21.1 and NeoForge 26.1.2 modules'
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build', ':neoforge-26.1.2:build'
}

subprojects {
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat = 'full'
            }
        }
    }
}
