plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'data_recipe_generator-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    // Forge's own Maven must win for these groups: the NeoForged Maven mirror is
    // not always reachable, while maven.minecraftforge.net is.
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.minecraftforge.net/' }
        }
        filter {
            includeGroup 'net.minecraftforge'
            includeGroup 'de.oceanlabs.mcp'
        }
    }
    mavenCentral()
}

legacyForge {
    version = '1.20.1-47.4.20'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        'data_recipe_generator' {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':common')
}

// Shared language files are part of this mod's resources.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

// Make the Minecraft-free common classes part of this module's runtime output.
// This covers both the dev run (which loads build/classes directly) and the jar.
sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Data Recipe Generator (Forge 1.20.1)',
                'Implementation-Version': project.version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
